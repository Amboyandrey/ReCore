name: recore

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recore
      POSTGRES_PASSWORD: recore
      POSTGRES_DB: recore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recore"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Host-side 16379 avoids clashing with a Redis that might already be running on the host;
      # containers still reach this one at redis:6379 on the compose network regardless.
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../apps/api
      dockerfile: ../../infra/Dockerfile.api
    environment:
      # Migrations (run on boot, see Dockerfile.api) always use the owner role above them both.
      DATABASE_URL: postgresql+asyncpg://recore:recore@postgres:5432/recore
      # The running API serves requests as the low-privilege role the RLS migration creates —
      # granted CRUD, no DDL, and actually subject to the row-level security policies (the owner
      # role above is exempt from RLS by Postgres default, which is why migrations use it and
      # requests don't). Dev-only password, same treatment as MASTER_KEY below.
      APP_DATABASE_URL: postgresql+asyncpg://recore_app:recore_app_dev_only@postgres:5432/recore
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000"]'
      DEBUG: "false"
      # Dev-only key, fine to commit — wraps provider-credential data keys (see .env.example).
      # Rotate and inject a real one via secrets/environment for any non-throwaway deployment.
      MASTER_KEY: "BpiLXgRyl3uYpRm32mG0+1lcq+BvToj7jg0XIuaENWA="
      STORAGE_DIR: /app/uploads
    volumes:
      - attachments_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: ../../infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  attachments_data:
