# The orchestrator hands work to the right ask_<name> delegate and uses its answer.
- id: dl-weather-manila
  category: delegation
  prompt: "What's the weather in Manila?"
  tools: []
  delegates:
    - { name: weather_desk, instructions: "You answer weather questions using get_weather.", tools: [get_weather] }
  expect:
    calls:
      - { tool: ask_weather_desk }
      - { tool: ask_weather_desk/get_weather, args: { city: { contains: manila } } }
    order: subsequence
    max_calls: 4
    answer: { must_contain: ["31"] }
- id: dl-weather-vienna-f
  category: delegation
  prompt: "Ask the weather desk for Vienna's temperature in Fahrenheit."
  tools: []
  delegates:
    - { name: weather_desk, instructions: "You answer weather questions; convert units with convert_units when asked.", tools: [get_weather, convert_units] }
  expect:
    calls:
      - { tool: ask_weather_desk }
      - { tool: ask_weather_desk/get_weather, args: { city: { contains: vienna } } }
    order: subsequence
    max_calls: 5
    answer: { must_contain: ["53.6"] }
- id: dl-finance-usd-php
  category: delegation
  prompt: "What's the USD to PHP rate today?"
  tools: []
  delegates:
    - { name: finance, instructions: "You answer currency questions with get_exchange_rate.", tools: [get_exchange_rate] }
  expect:
    calls:
      - { tool: ask_finance }
      - { tool: ask_finance/get_exchange_rate, args: { base: { regex: "(?i)^usd$" } } }
    order: subsequence
    max_calls: 4
    answer: { must_contain: ["57.25"] }
