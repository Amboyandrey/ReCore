- id: dl-two-delegates
  category: delegation
  prompt: "I'm flying to Tokyo. What's the weather there, and what's the JPY to PHP rate?"
  tools: []
  delegates:
    - { name: weather_desk, instructions: "You answer weather questions using get_weather.", tools: [get_weather] }
    - { name: finance, instructions: "You answer currency questions with get_exchange_rate.", tools: [get_exchange_rate] }
  expect:
    calls:
      - { tool: ask_weather_desk }
      - { tool: ask_finance }
      - { tool: ask_weather_desk/get_weather, args: { city: { contains: tokyo } } }
      - { tool: ask_finance/get_exchange_rate, args: { base: { regex: "(?i)^jpy$" } } }
    max_calls: 6
    answer: { must_contain: ["22", "0.38"], judge: "Reports Tokyo's weather and the JPY to PHP rate together in one coherent answer." }
