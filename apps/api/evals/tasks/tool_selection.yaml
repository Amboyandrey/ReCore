# One correct tool, chosen from several, with the right arguments.
- id: ts-weather-manila
  category: tool_selection
  prompt: "What's the weather like in Manila right now?"
  tools: [get_weather, get_exchange_rate, search_docs]
  expect:
    calls: [{ tool: get_weather, args: { city: { contains: manila } } }]
    max_calls: 2
    answer: { must_contain: ["31"], judge: "Gives Manila's temperature (31 C) and mentions humid or showery conditions." }
- id: ts-weather-tokyo
  category: tool_selection
  prompt: "Current temperature in Tokyo?"
  tools: [get_weather, convert_units, list_calendar_events]
  expect:
    calls: [{ tool: get_weather, args: { city: { contains: tokyo } } }]
    max_calls: 2
    answer: { must_contain: ["22"] }
- id: ts-weather-oslo
  category: tool_selection
