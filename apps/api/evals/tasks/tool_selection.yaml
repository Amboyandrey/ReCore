- id: ts-rate-usd-php
  category: tool_selection
  prompt: "What's the USD to PHP exchange rate?"
  tools: [get_exchange_rate, get_weather, convert_units]
  expect:
    calls: [{ tool: get_exchange_rate, args: { base: { regex: "(?i)^usd$" }, quote: { regex: "(?i)^php$" } } }]
    max_calls: 2
    answer: { must_contain: ["57.25"], judge: "States the USD to PHP rate as 57.25 without inventing other rates." }
- id: ts-rate-eur-usd
